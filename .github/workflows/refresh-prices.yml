name: refresh-prices

on:
  schedule:
    # 每小时第 5 分钟；整点前后 GitHub 排队最拥堵，错开可显著减少延迟
    - cron: '5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [refresh]
  push:
    paths:
      - 'data/watchlist.json'
    branches: [main]

concurrency:
  group: refresh-prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch prices
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: node scripts/fetch-prices.mjs

      - name: Commit data
        run: |
          git config user.name "steam-price-bot"
          git config user.email "steam-price-bot@users.noreply.github.com"
          # 只提交抓取产物；watchlist.json 归页面写，避免把用户的增删/置顶回滚
          git add data/prices.json data/history.json data/itad-cache.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): prices @ $(date -u +%FT%TZ)"
            # 远端可能被上一次运行或页面写入推进；冲突时以本次新抓的数据为准
            git fetch origin main
            git rebase -X theirs origin/main
            git push
          fi
