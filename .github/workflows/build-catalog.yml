name: build-catalog

on:
  schedule:
    - cron: '17 3 * * 1' # 每周一 UTC 03:17（北京时间 11:17）：索引 1.5MB，逐日重建会把仓库迅速撑大
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build search catalog
        run: node scripts/build-catalog.mjs

      - name: Commit catalog
        run: |
          git config user.name "steam-price-bot"
          git config user.email "steam-price-bot@users.noreply.github.com"
          git add data/catalog.json
          if git diff --staged --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "chore(data): catalog @ $(date -u +%FT%TZ)"
            git push
          fi
